name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "LogiMatch_CI_2026!"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P LogiMatch_CI_2026! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_NOLOGO: "true"
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=LogiMatchDB;User Id=sa;Password=LogiMatch_CI_2026!;TrustServerCertificate=True;"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore src/LogiMatch.sln

      - name: Build
        run: dotnet build src/LogiMatch.sln -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test src/UnitTests/UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=unit-tests.trx"

      - name: Run Integration Tests
        run: dotnet test src/IntegrationTests/IntegrationTests.csproj -c Release --no-build --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

  docker-build:
    name: Validate API Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Image
        run: docker build -f src/API/Dockerfile -t logimatch-api .
