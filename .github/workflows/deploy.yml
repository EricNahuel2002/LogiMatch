name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend (Oracle Cloud)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fallo intencionado: el despliegue aún no está configurado.
      # El esqueleto real de Oracle Cloud se habilitará cuando la aplicación esté lista.
      - name: Guard Deployment Not Configured
        run: |
          echo "::error::Backend deployment is not configured yet."
          exit 1

